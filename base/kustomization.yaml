apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base commune à tous les environnements : aucun namespace, aucune valeur spécifique.
resources:
  - redis.yaml
  - db.yaml
  - vote.yaml
  - result.yaml
  - worker.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: voting-app
    includeSelectors: false

# Le ConfigMap est généré : son nom reçoit un suffixe de hachage (vote-config-xxxxx)
# et les Deployments qui le référencent sont réécrits automatiquement.
configMapGenerator:
  - name: vote-config
    literals:
      - OPTION_A=Cats
      - OPTION_B=Dogs

# Bonus sync waves : vague 0 (défaut) = redis, db, Services, ConfigMap, PVC ;
# vague 1 = consommateurs (vote, result, worker) ; vague 2 = exposition (Ingress).
patches:
  - patch: |-
      - op: add
        path: /metadata/annotations
        value: {"argocd.argoproj.io/sync-wave": "1"}
    target:
      kind: Deployment
      name: (vote|result|worker)
  - patch: |-
      - op: add
        path: /metadata/annotations
        value: {"argocd.argoproj.io/sync-wave": "2"}
    target:
      kind: Ingress
