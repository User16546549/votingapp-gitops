# Application Argo CD vote-dev : exportée (argocd app get vote-dev -o yaml) puis épurée.
# Gardé : project, source, destination, syncPolicy. Retiré : status, managedFields, uid, resourceVersion...
# L'export de la CLI ne contient ni apiVersion ni kind : ajoutés pour kubectl apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vote-dev
  namespace: argocd           # l'objet Application vit dans argocd, pas dans vote-dev
spec:
  destination:
    namespace: vote-dev
    server: https://kubernetes.default.svc
  project: voting
  source:
    path: overlays/dev
    repoURL: https://github.com/User16546549/votingapp-gitops.git
    targetRevision: main
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
